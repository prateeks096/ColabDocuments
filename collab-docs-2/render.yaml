services:
  - type: web
    name: collab-docs
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
    disk:
      name: collab-docs-data
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 1
